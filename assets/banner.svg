<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic animations positioned safely in the background / periphery */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes orbitFloat1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(18px, -15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes orbitFloat2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-20px, 16px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { fill-opacity: 0.3; }
      50% { fill-opacity: 1; }
    }

    .bg-sphere-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-sphere-2 {
      animation: pulseGlow 9s ease-in-out infinite 1.5s;
      transform-origin: 1000px 240px;
    }
    .floating-card-1 {
      animation: orbitFloat1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: orbitFloat2 7.5s ease-in-out infinite;
    }
    .flowing-stream {
      stroke-dasharray: 12, 12;
      animation: flowLine 3s linear infinite;
    }
    .blink-node {
      animation: nodeBlink 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="bg-sphere-1">
    <circle cx="180" cy="100" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#softGlow)" />
  </g>
  <g class="bg-sphere-2">
    <circle cx="1020" cy="220" r="160" fill="#a855f7" fill-opacity="0.12" filter="url(#softGlow)" />
  </g>

  <!-- Animated Dynamic Data Circuit Lines in Periphery -->
  <path class="flowing-stream" d="M 60 40 L 320 40 L 400 90 L 800 90 L 880 40 L 1140 40" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.35" />
  <path class="flowing-stream" d="M 60 320 L 280 320 L 360 270 L 840 270 L 920 320 L 1140 320" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" />

  <!-- Animated Interactive / System Peripheral Cards (Kept strictly on right & top corners to never block text) -->
  <g class="floating-card-1" transform="translate(930, 48)">
    <rect width="210" height="66" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="28" cy="33" r="12" fill="#0284c7" fill-opacity="0.25" />
    <path d="M 23 33 L 27 37 L 34 29" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="29" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">SCIM 2.0 In Sync</text>
    <text x="50" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Active Directory ⇄ IdP</text>
  </g>

  <g class="floating-card-2" transform="translate(930, 246)">
    <rect width="210" height="66" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="28" cy="33" r="12" fill="#9333ea" fill-opacity="0.25" />
    <circle cx="28" cy="33" r="5" fill="#c084fc" class="blink-node" />
    <text x="50" y="29" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">RBAC &amp; ReBAC Enforced</text>
    <text x="50" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Zero-Trust Verified</text>
  </g>

  <!-- Key Icon / Shield Graphic Foreground Badge -->
  <g transform="translate(80, 52)">
    <rect width="58" height="58" rx="14" fill="url(#accentCyan)" opacity="0.15" />
    <rect x="1" y="1" width="56" height="56" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 29 16 L 43 22 V 32 C 43 40.5 37 47 29 50 C 21 47 15 40.5 15 32 V 22 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="29" cy="28" r="3.5" fill="#38bdf8" />
    <path d="M 29 31.5 V 39 M 26.5 35.5 H 31.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Crisp and Unobstructed) -->
  <g transform="translate(156, 76)">
    <rect width="186" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="16.5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED KNOWLEDGE</text>
  </g>

  <g transform="translate(80, 160)">
    <text class="title-text" x="0" y="0">
      Awesome User Provisioning &amp; Access Control
    </text>
    <text class="subtitle-text" x="0" y="38">
      A curated universe of User Lifecycle Management, SCIM 2.0 Automation, SSO, and IGA Solutions
    </text>
  </g>

  <!-- Tags / Capability Pills at the Bottom -->
  <g transform="translate(80, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="138" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
      <text class="badge-text" x="32" y="21.5">User Lifecycle</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(150, 0)">
      <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#a855f7" />
      <text class="badge-text" x="32" y="21.5">SCIM 2.0</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(282, 0)">
      <rect width="158" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#ec4899" />
      <text class="badge-text" x="32" y="21.5">RBAC &amp; ReBAC</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(452, 0)">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#10b981" />
      <text class="badge-text" x="32" y="21.5">IGA &amp; PAM</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(594, 0)">
      <rect width="146" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#f59e0b" />
      <text class="badge-text" x="32" y="21.5">Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Highlight Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#glowGlow)" />
</svg>
